name: Build on demand

# Manual only, so pushes and pull requests do not spend Actions minutes.
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Also run the Playwright E2E suite (slower)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint, typecheck and unit tests
        run: docker build --target test .

      - name: Build dist
        run: docker build --target dist --output type=local,dest=out .

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bmc-ui-dist
          path: out
          retention-days: 7

      - name: Build E2E image
        if: ${{ inputs.run_e2e }}
        run: docker build --target e2e -t bmc-ui-e2e .

      - name: Run E2E suite
        if: ${{ inputs.run_e2e }}
        run: docker run --rm --ipc=host bmc-ui-e2e
